name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm exec turbo run build --concurrency=1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Diagnose Windows sandbox startup
        if: matrix.os == 'windows-latest'
        run: node scripts/diagnose-windows-sandbox.cjs

      - name: Test
        run: pnpm exec turbo run test --concurrency=1 -- --maxWorkers=1 --minWorkers=1

      - name: Release workflow regression
        run: node scripts/test-release-workflow.mjs

      # BUG-8: the matrix harness is plain .mjs against built dist/, so a core
      # refactor could break it invisibly (72b668d did; a stale score survived
      # for weeks). This smoke runs the real orchestrator + prose-fallback +
      # grader pipeline against a scripted mock provider — no network, no keys.
      - name: Harness smoke
        run: node scripts/harness-smoke.mjs

      - name: Clean package consumer smoke
        run: pnpm smoke:package
