name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec turbo run build --concurrency=1
      - name: Deterministic harness acceptance (no provider calls)
        run: pnpm smoke:harness
      - name: Reject false-positive smoke and release results
        run: |
          node scripts/test-smoke-test.cjs
          node scripts/check-release-coverage.cjs
          node scripts/check-live-mode-presets.cjs
          node scripts/check-live-repo-feature.cjs
          node scripts/check-acceptance-accounting.cjs
