name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.5)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Sync version
        id: version
        run: |
          node -e '
            const fs = require("node:fs");
            const raw = process.env.VERSION;
            const version = raw.startsWith("v") ? raw.slice(1) : raw;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:(?:0|[1-9]\d*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) {
              throw new Error("Invalid release version");
            }
            for (const file of ["package.json", ...fs.readdirSync("packages").filter((name) => name.startsWith("chimera-")).map((name) => `packages/${name}/package.json`)]) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            }
            console.log(`Synchronized package versions to ${version}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          '
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Clean package consumer smoke
        run: pnpm smoke:package
        env:
          CHIMERA_PACKAGE_OFFLINE: '1'

      - name: Publish runtime packages to npm
        run: |
          for package in \
            @chimera/paths \
            @chimera/domain \
            @chimera/context \
            @chimera/providers \
            @chimera/lsp \
            @chimera/core \
            @chimera/isolation \
            @chimera/tools \
            @chimera/session \
            @chimera/eval \
            @chimera/tui \
            @chimera/learning \
            @chimera/daemon \
            @chimera/cli; do
            pnpm --filter "$package" publish --no-git-checks --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
